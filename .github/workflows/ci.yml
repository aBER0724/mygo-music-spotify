name: CI

# Every push and pull request is verified. A push to main whose plugin.json
# version has no release yet is released: CI tags the commit v<version> and
# publishes plugin.zip, which MyGo Music installs from the latest release,
# with the version's CHANGELOG entry as the notes when it has one, and
# GitHub's generated notes otherwise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run verify
      - run: node scripts/pack.mjs
      - name: Check plugin.zip
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile("dist/plugin.zip") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"corrupt entry: {bad}")
              names = set(z.namelist())
          manifest = json.load(open("plugin.json"))
          wanted = {"plugin.json", manifest["main"], "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "soloist/README.txt"}
          wanted |= {f"locales/{name}" for name in os.listdir("locales") if name.endswith(".json")}
          if not wanted <= names:
              raise SystemExit(f"missing from plugin.zip: {sorted(wanted - names)}")
          print(f"plugin.zip ok: {len(names)} entries")
          PY
      - name: The same sources make the same plugin.zip
        run: |
          sha=$(sha256sum dist/plugin.zip | cut -d' ' -f1)
          node scripts/pack.mjs >/dev/null
          test "$sha" = "$(sha256sum dist/plugin.zip | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/plugin.zip
          if-no-files-found: error

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, so two pushes can't both publish a version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./plugin.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.released == 'false'
        with:
          name: plugin
          path: dist
      - name: Release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/plugin.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/plugin.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
